<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061714">
<title>Draft Night</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="app" class="phone"></div>
<script src="/static/common.js"></script>
<script>
const { el, esc, post, connect, runClock, toast, playerCard, needList } = DN;

const SEAT = "draftnight.seat";
let seat = null;
let snap = null;
let lastKey = null;

try { seat = JSON.parse(localStorage.getItem(SEAT) || "null"); } catch { seat = null; }

const me = () =>
  seat && snap ? snap.managers.find((m) => m.mid === seat.mid) || null : null;

/* ---------- screens ---------- */

function renderJoin(s) {
  if (s.phase !== "lobby") {
    return `<h2 style="font-family:var(--display);font-size:2rem;margin:2.5rem 0 .5rem">
      Auction under way</h2>
      <p class="muted">You can't join once the first lot is up. Watch the TV, and
      ask the host to restart if you were meant to be in.</p>`;
  }
  const squadSize = Object.values(s.formation).reduce((a, b) => a + b, 0);
  const taken = s.managers.map((m) => esc(m.name)).join(", ");
  return `<h2 style="font-family:var(--display);font-size:2.6rem;margin:1.5rem 0 .25rem">
    Draft Night</h2>
  <p class="muted">${s.managers[0]?.budget ?? 200} points, ${squadSize} players to buy.</p>
  <div class="field" style="margin-top:1.75rem;text-align:left">
    <label for="nm">Your name</label>
    <input id="nm" placeholder="Rohit" maxlength="24" autocomplete="off">
  </div>
  <button id="join" style="width:100%">Take a seat</button>
  <p class="error" id="joinerr"></p>
  ${taken ? `<p class="muted" style="margin-top:1.5rem">Already in: ${taken}</p>` : ""}`;
}

function purseBar(m) {
  return `<div class="purse-bar">
    <span class="name">${esc(m.name)}</span>
    <span class="amount">${m.left}</span>
  </div>`;
}

function mysquad(m) {
  const rows = m.roster.map((r) =>
    `<li><span>${esc(r.name)} <span class="muted">${esc(r.pos)} ${r.rating}</span></span>
      <span class="price">${r.price}</span></li>`).join("");
  const open = Object.entries(m.needs).flatMap(([p, n]) =>
    Array(n).fill(`<li class="vacant"><span>${p} to fill</span><span></span></li>`)
  ).join("");
  return `<section class="mysquad"><h3>Your squad</h3><ul>${rows}${open}</ul></section>`;
}

function renderWaiting(m) {
  return purseBar(m) +
    `<p class="muted">Waiting for the host to start. You need ${needList(m.needs)}.</p>
     <button class="quiet" id="leave" style="margin-top:1.5rem">Give up my seat</button>`;
}

function renderFloor(m, s) {
  const l = s.lot;
  let action;

  if (s.phase !== "bidding" || !l) {
    action = `<p class="muted" style="margin-top:1.5rem">Next lot coming up.</p>`;
  } else if (m.leading) {
    action = `<button class="bid-big" disabled>You lead at ${s.high_bid}</button>
      <p class="cap">Sit tight.</p>`;
  } else if (!m.needs[l.pos]) {
    action = `<button class="bid-big" disabled>No ${esc(l.pos)} slot</button>
      <p class="cap">You still need ${needList(m.needs)}.</p>`;
  } else if (m.max_bid < s.next_bid) {
    action = `<button class="bid-big" disabled>Priced out</button>
      <p class="cap">Your limit is ${m.max_bid}, next bid is ${s.next_bid}.</p>`;
  } else {
    const jumps = [2, 5, 10].map((n) => s.next_bid + n).filter((v) => v <= m.max_bid);
    action = `<button class="bid-big" id="bid" data-amount="${s.next_bid}">
        Bid ${s.next_bid}</button>
      ${jumps.length ? `<div class="jumps">${jumps.map((v) =>
        `<button class="jump" data-amount="${v}">${v}</button>`).join("")}</div>` : ""}
      <p class="cap">Most you can bid: ${m.max_bid}.
        ${m.slots_left > 1 ? `${m.slots_left - 1} slots after this.` : "Last slot."}</p>`;
  }

  const standing = s.high_bid
    ? `<b>${s.high_bid}</b> with ${esc(s.high_bidder_name)}`
    : `no bids, opens at <b>${s.min_bid}</b>`;

  return purseBar(m) +
    (l ? playerCard(l, "small") +
      `<p class="standing">${standing}</p>
       <div class="clock" data-clock style="margin:.9rem auto 0"><span data-clock-bar></span></div>`
      : "") +
    action + mysquad(m);
}

function renderReview(m) {
  return purseBar(m) +
    `<p class="muted">Draft done. ${m.budget - m.left} spent, ${m.left} left over.</p>` +
    mysquad(m);
}

/* ---------- wiring ---------- */

function bind() {
  el("join")?.addEventListener("click", async () => {
    const name = el("nm").value.trim();
    if (!name) { el("joinerr").textContent = "Needs a name."; return; }
    try {
      const data = await post("/api/join", { name });
      seat = { mid: data.mid, name: data.name };
      localStorage.setItem(SEAT, JSON.stringify(seat));
      lastKey = null;
      render();
    } catch (e) {
      el("joinerr").textContent = e.message;
    }
  });

  el("leave")?.addEventListener("click", async () => {
    try { await post("/api/leave", { mid: seat.mid }); }
    catch (e) { toast(e.message); return; }
    localStorage.removeItem(SEAT);
    seat = null;
    lastKey = null;
    render();
  });

  const send = async (amount) => {
    try { await post("/api/bid", { mid: seat.mid, amount }); }
    catch (e) { toast(e.message); }
  };

  el("bid")?.addEventListener("click", (ev) => send(+ev.currentTarget.dataset.amount));
  document.querySelectorAll(".jump").forEach((b) =>
    b.addEventListener("click", (ev) => send(+ev.currentTarget.dataset.amount)));
}

function render() {
  const s = snap;
  if (!s) return;
  const m = me();

  // seat from a previous auction, or the server restarted under us
  if (seat && !m) { localStorage.removeItem(SEAT); seat = null; }

  const key = m
    ? `${s.phase}:${s.lot_number}:${s.high_bid}:${s.high_bidder}:${m.roster.length}:${m.left}`
    : `join:${s.phase}:${s.managers.length}`;
  if (key === lastKey) return;
  lastKey = key;

  const held = el("nm")?.value;
  const app = el("app");

  if (!m) app.innerHTML = renderJoin(s);
  else if (s.phase === "lobby") app.innerHTML = renderWaiting(m);
  else if (s.phase === "review") app.innerHTML = renderReview(m);
  else app.innerHTML = renderFloor(m, s);

  if (el("nm") && held) el("nm").value = held;
  bind();
}

connect(
  (s) => { snap = s; render(); },
  () => toast("Lost the connection. Reconnecting...")
);
runClock();
</script>
</body>
</html>
