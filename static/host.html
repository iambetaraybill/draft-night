<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft Night</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="app" class="tv"></div>
<script src="/static/common.js"></script>
<script>
const { el, esc, post, connect, runClock, playerCard, needList } = DN;

const token = new URLSearchParams(location.search).get("host") || "";
let boot = { join_url: "", model: "", model_ok: false, model_note: "" };
let snap = null;
let lastKey = null;
let lastBid = null;

const hostPost = (path, body) => post(path, body, { "X-Host-Token": token });

/* ---------- fragments ---------- */

function rail(s) {
  const where = s.phase === "lobby"
    ? "waiting to start"
    : `lot ${s.lot_number} · ${s.pool_left} left in the pool`;
  return `<header class="rail">
    <h1 class="mark">Draft Night</h1>
    <span class="muted">${where}</span>
    <span class="spacer"></span>
    ${s.phase !== "lobby"
      ? `<span class="muted">phones <code>${esc(boot.join_url)}</code></span>`
      : ""}
  </header>`;
}

function money(s) {
  return s.high_bid
    ? `<span class="figure" id="figure">${s.high_bid}</span>
       <span class="holder">with <b>${esc(s.high_bidder_name)}</b></span>`
    : `<span class="figure none" id="figure">&ndash;</span>
       <span class="holder muted">opens at ${s.min_bid}</span>`;
}

function ticker(s) {
  if (!s.bids.length) return `<li class="muted">no bids yet</li>`;
  return s.bids.map((b) =>
    `<li><span>${esc(b.manager)}${b.is_ai ? " proxy" : ""}</span>
      <span class="amt">${b.amount}</span></li>`).join("");
}

function scoreboard(s) {
  return s.managers.map((m) => {
    const spent = m.max_bid < s.next_bid && !m.leading;
    let pip = "";
    if (m.is_ai) {
      pip = m.interested
        ? `<span class="pip in">in</span>`
        : `<span class="pip">proxy</span>`;
    }
    return `<div class="slot ${m.leading ? "leading" : ""} ${spent ? "spent" : ""}">
      <span class="who">${esc(m.name)}${pip}</span>
      <span class="purse">${m.left}</span>
      <span class="gaps">${needList(m.needs)}</span>
    </div>`;
  }).join("");
}

/* ---------- phases ---------- */

function renderLobby(s) {
  const chairs = s.managers.map((m) =>
    `<span class="chair ${m.is_ai ? "proxy" : ""}">${esc(m.name)}</span>`
  ).join("") || `<span class="muted">nobody yet</span>`;

  const squadSize = Object.values(s.formation).reduce((a, b) => a + b, 0);
  const shape = Object.entries(s.formation).map(([p, n]) => `${n} ${p}`).join(", ");
  const model = boot.model_ok
    ? `Proxy managers think with <b>${esc(boot.model)}</b>, running on this laptop.`
    : `Heuristic mode: ${esc(boot.model_note)}. Proxy managers bid on ratings
       alone until a model is running.`;

  return rail(s) + `<main class="lobby">
    <h2>Open this on your phone</h2>
    <p class="joinurl">${esc(boot.join_url)}</p>
    <p>Same wifi as this laptop. ${s.managers[0]?.budget ?? 200} points each and a
       squad of ${squadSize} to fill: ${shape}.<br>${model}</p>

    <div class="seats">${chairs}</div>

    <section class="panel">
      <h3>Bidding for someone who can't be here</h3>
      <div class="field">
        <label for="agname">Their name</label>
        <input id="agname" placeholder="Sam" maxlength="24" autocomplete="off">
      </div>
      <div class="field">
        <label for="agstrat">Their instructions, in their own words</label>
        <textarea id="agstrat" placeholder="I want pace up front above all else. Get a keeper early so I'm not stuck with whoever is left. Never spend more than 40% of my budget on one player."></textarea>
      </div>
      <div class="row" style="justify-content:flex-start">
        <button id="addagent">Add proxy manager</button>
        <span class="muted">They bid live, inside their budget.</span>
      </div>
      <p class="error" id="agerr"></p>
    </section>

    <div class="row" style="margin-top:1.75rem">
      <button id="start" ${s.managers.length < 2 ? "disabled" : ""}>Start the auction</button>
      <span class="muted">${s.managers.length < 2
        ? "Needs at least two managers."
        : `${s.managers.length} ready.`}</span>
    </div>
    <p class="error" id="starterr"></p>
  </main>
  <div></div>`;
}

function renderBidding(s) {
  return rail(s) + `<main class="stage">
    ${playerCard(s.lot, "big")}
    <div class="money">${money(s)}</div>
    <div class="clock" data-clock><span data-clock-bar></span></div>
    <p class="clock-note" id="note"></p>
    <ul class="ticker" id="tick">${ticker(s)}</ul>
  </main>
  <footer class="scoreboard" id="board">${scoreboard(s)}</footer>`;
}

function renderSold(s) {
  const r = s.result;
  const body = !r ? "" : r.price === null
    ? `<section class="result unsold">
         <p class="stamp">No bids</p>
         <p class="detail">${esc(r.player)} goes unsold.</p>
       </section>`
    : `<section class="result">
         <p class="stamp">Sold &middot; ${r.price}</p>
         <p class="detail">${esc(r.player)} to <b>${esc(r.winner)}</b></p>
         ${r.reason ? `<p class="said">${esc(r.reason)}</p>` : ""}
       </section>`;
  return rail(s) + `<main class="stage">
    ${body}
    <p class="clock-note" id="patter">${esc(s.commentary || "")}</p>
  </main>
  <footer class="scoreboard" id="board">${scoreboard(s)}</footer>`;
}

function renderReview(s) {
  const squads = s.managers.map((m) => {
    const rows = m.roster.map((r) =>
      `<li><span>${esc(r.name)} <span class="muted">${esc(r.pos)} ${r.rating}</span></span>
        <span class="price">${r.price}</span></li>`).join("");
    const empty = Array(m.slots_left).fill(
      `<li class="vacant"><span>unfilled</span><span></span></li>`).join("");
    return `<section class="panel">
      <h3><span>${esc(m.name)}${m.is_ai ? " · proxy" : ""}</span>
          <span class="price">${m.budget - m.left}</span></h3>
      <ul>${rows}${empty}</ul>
    </section>`;
  }).join("");

  const st = s.stats;
  const note = s.llm
    ? `${st.llm_calls} model calls at ${st.avg_latency_ms} ms average.
       ${st.heuristic_calls} fell back to the heuristic.
       ${st.clamped} tried to overspend and were capped.`
    : `Heuristic mode: ${st.heuristic_calls} valuations, no model calls.`;

  return rail(s) + `<main>
    <div class="lobby"><h2>Final squads</h2><p>${s.unsold} went unsold. ${note}</p></div>
    <div class="squads">${squads}</div>
  </main>
  <div></div>`;
}

/* ---------- patching ---------- */

function patch(s) {
  const fig = el("figure");
  if (fig && s.high_bid !== lastBid) {
    const wrap = fig.parentElement;
    if (wrap) wrap.innerHTML = money(s);
    const fresh = el("figure");
    if (fresh && s.high_bid) {
      fresh.classList.add("bumped");
      setTimeout(() => fresh.classList.remove("bumped"), 300);
    }
    lastBid = s.high_bid;
  }
  const board = el("board");
  if (board) board.innerHTML = scoreboard(s);
  const tick = el("tick");
  if (tick) tick.innerHTML = ticker(s);
  const patter = el("patter");
  if (patter) patter.textContent = s.commentary || "";
}

function render() {
  const s = snap;
  if (!s) return;
  const key = `${s.phase}:${s.lot_number}:${s.managers.length}`;
  if (key === lastKey) { patch(s); return; }
  lastKey = key;
  lastBid = s.high_bid;

  // keep anything half-typed before rebuilding under the host's hands
  const held = { name: el("agname")?.value, strategy: el("agstrat")?.value };

  const app = el("app");
  if (s.phase === "lobby") app.innerHTML = renderLobby(s);
  else if (s.phase === "review") app.innerHTML = renderReview(s);
  else if (s.phase === "sold") app.innerHTML = renderSold(s);
  else app.innerHTML = renderBidding(s);

  if (el("agname") && held.name) el("agname").value = held.name;
  if (el("agstrat") && held.strategy) el("agstrat").value = held.strategy;

  el("addagent")?.addEventListener("click", async () => {
    try {
      await hostPost("/api/agent", {
        name: el("agname").value.trim(),
        strategy: el("agstrat").value.trim(),
      });
      el("agname").value = "";
      el("agstrat").value = "";
      el("agerr").textContent = "";
    } catch (e) {
      el("agerr").textContent = e.message;
    }
  });

  el("start")?.addEventListener("click", async () => {
    try { await hostPost("/api/start"); }
    catch (e) { el("starterr").textContent = e.message; }
  });
}

/* ---------- go ---------- */

(async function main() {
  boot = await fetch("/api/bootstrap").then((r) => r.json());
  connect((s) => { snap = s; render(); });
  runClock((left) => {
    const note = el("note");
    if (note) {
      const snipe = Math.round(snap.snipe_seconds ?? 7);
      note.textContent = left <= 0
        ? "Going..."
        : `${left.toFixed(1)}s left. Any bid puts ${snipe} seconds back on the clock.`;
    }
  });
})();
</script>
</body>
</html>
